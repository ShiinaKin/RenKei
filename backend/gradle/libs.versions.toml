[versions]
exposed = "1.3.1"
hikari = "7.0.2"
sqlite = "3.51.3.0"
kotlin = "2.4.0"
logback = "1.5.37"
ucasoft-ktorSimpleCache = "0.72.1"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module="org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed"}
exposed-dao = { module="org.jetbrains.exposed:exposed-dao", version.ref = "exposed"}
exposed-json = { module="org.jetbrains.exposed:exposed-json", version.ref = "exposed"}
exposed-migration-jdbc = { module="org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed"}
exposed-kotlin-datetime = { module="org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed"}

sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ucasoft-ktorSimpleCache = { module = "com.ucasoft.ktor:ktor-simple-cache", version.ref = "ucasoft-ktorSimpleCache" }
ucasoft-ktorSimpleMemoryCache = { module = "com.ucasoft.ktor:ktor-simple-memory-cache", version.ref = "ucasoft-ktorSimpleCache" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
